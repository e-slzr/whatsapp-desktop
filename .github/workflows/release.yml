name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  release:
    name: Build Linux Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Clean non-Linux assets from all releases
        run: |
          echo "Inspeccionando todas las releases para eliminar instaladores no pertenecientes a Linux..."
          tags=$(gh release list --repo "${{ github.repository }}" --json tagName --jq '.[].tagName' 2>/dev/null || echo "v1.0.0 v1.0.1")
          for tag in $tags; do
            echo "Revisando release: $tag"
            assets=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[] | select(.name | test("\\.(exe|dmg|zip|blockmap)$")) | .name' 2>/dev/null || true)
            for asset in $assets; do
              echo "Eliminando archivo de Windows/Mac en $tag: $asset"
              gh release delete-asset "$tag" "$asset" --repo "${{ github.repository }}" -y || true
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}
          name: WhatsApp Desktop ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            dist/*.AppImage
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
